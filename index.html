function spiritLine(x){
  var price, sub;
  if(x.b && x.s){ price = "€ " + x.b + " / € " + x.s; sub = tt("bicShot"); }
  else if(x.b){ price = "€ " + x.b; sub = tt("bicchiere"); }
  else { price = "€ " + x.s; sub = "Shot"; }
  return simpleLine(x.n, price, sub);
}

function nameLine(n){
  return '<div class="li"><div class="row"><span class="iname">' + n + '</span></div></div>';
}

function simpleLine(name, price, sub){
  return '<div class="li"><div class="row"><span class="iname">' + name + '</span><span class="dots"></span><span class="price">' + price + '</span></div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}

let revealObs=null, spyObs=null;
function initReveal(){
  if(revealObs) revealObs.disconnect();
  const items = document.querySelectorAll(".reveal");
  if(reducedMotion || !("IntersectionObserver" in window)){
    items.forEach(el=>el.classList.add("visible")); return;
  }
  revealObs = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("visible"); revealObs.unobserve(e.target); } });
  },{threshold:.06});
  items.forEach(el=>revealObs.observe(el));
}

function initSpy(){
  if(spyObs) spyObs.disconnect();
  const tabs = [...document.querySelectorAll(".tab")];
  const setActive = id => {
    tabs.forEach(t=>t.classList.toggle("active", t.dataset.target===id));
    const a = tabs.find(t=>t.dataset.target===id);
    if(a) a.scrollIntoView({behavior: reducedMotion ? "auto" : "smooth", block:"nearest", inline:"center"});
  };
  if(!("IntersectionObserver" in window)){ if(tabs[0]) setActive(tabs[0].dataset.target); return; }
  spyObs = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); });
  },{rootMargin:"-30% 0px -62% 0px"});
  document.querySelectorAll("section.cat").forEach(s=>spyObs.observe(s));
  if(tabs[0]) tabs[0].classList.add("active");
}
